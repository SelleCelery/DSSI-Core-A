<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DSSI Core A</title>
    <link rel="stylesheet" href="base.css" />
  </head>
  <body class="dssi-page dssi-popup">
    <main>
      <h1>DSSI Core A</h1>
      <p class="tagline">最後に止めるのではなく、最初に気づけるようにする。</p>
      <label class="row">
        <span>有効</span>
        <input id="enabled" type="checkbox" />
      </label>
      <label class="field">
        <span>粘性レベル</span>
        <select id="viscosityLevel">
          <option value="1">1 — Silent</option>
          <option value="2">2 — Awareness</option>
          <option value="3">3 — Sovereign</option>
        </select>
      </label>
      <label class="field">
        <span>報告モード</span>
        <select id="reportingMode">
          <option value="standard">標準</option>
          <option value="max_coverage">MAX — 診断と観測限界を最大限表示</option>
        </select>
      </label>
      <p class="small">
        MAXはLevel 4ではなく、現在の観測範囲と死角を学習的に可視化する特別モードです。
      </p>
      <p id="status" class="status" role="status"></p>
      <p class="small">観測件数（現在のブラウザセッション）: <strong id="count">0</strong></p>

      <section aria-labelledby="recentHeading">
        <h2 id="recentHeading">最新の観測</h2>
        <p id="recentEmpty" class="small">入力面に関する観測はまだありません。</p>
        <ul id="recentList" class="observation-list" aria-live="polite"></ul>
      </section>

      <div class="button-row">
        <button id="openLog" type="button">観測ログを表示</button>
        <button id="openOptions" type="button">設定とプライバシー</button>
      </div>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
