<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DSSI Sprint 1 Input Surface Fixture</title>
    <style>
      body {
        max-width: 760px;
        margin: 40px auto;
        padding: 0 20px;
        font-family: system-ui, sans-serif;
        line-height: 1.6;
      }
      label,
      section {
        display: block;
        margin: 22px 0;
      }
      input,
      textarea,
      [contenteditable] {
        box-sizing: border-box;
        display: block;
        width: 100%;
        margin-top: 6px;
        padding: 10px;
      }
      [contenteditable] {
        min-height: 80px;
        border: 1px solid #888;
      }
    </style>
  </head>
  <body>
    <h1>DSSI Sprint 1 手動確認ページ</h1>
    <p>各入力面へフォーカスし、キー入力・貼り付け・ブラウザ自動入力を試してください。</p>

    <label>
      メールアドレス
      <input type="email" name="email" autocomplete="email" />
    </label>

    <label>
      パスワード
      <input type="password" name="password" autocomplete="current-password" />
    </label>

    <label>
      カード番号
      <input type="text" name="card-number" autocomplete="cc-number" inputmode="numeric" />
    </label>

    <label>
      電話番号
      <input type="tel" name="phone" autocomplete="tel" />
    </label>

    <label>
      コメント
      <textarea name="comment" rows="5"></textarea>
    </label>

    <section>
      <strong>contenteditable</strong>
      <div contenteditable="true" role="textbox" aria-label="自由記述"></div>
    </section>

    <section id="dynamic-area">
      <button type="button" id="add-field">動的入力欄を追加</button>
    </section>

    <script>
      document.querySelector('#add-field').addEventListener('click', () => {
        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = '動的に追加された入力欄';
        document.querySelector('#dynamic-area').append(input);
      });
    </script>
  </body>
</html>
